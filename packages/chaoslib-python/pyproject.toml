[project]
name = "chaoslib-python"
version = "1.0.0"
description = "A lightweight chaos engineering toolkit for Python APIs"
authors = [{name = "Developer"}]
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "fastapi",
    "flask",
    "httpx",
    "requests"
]
